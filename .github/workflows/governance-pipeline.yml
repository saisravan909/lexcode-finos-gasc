name: FINOS governance pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  policy-and-calm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.13'

      - name: Run policy demo and checks
        run: bash scripts/demo.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the policy evidence
        run: cosign sign-blob artifacts/audit_attestation.json --bundle artifacts/audit_attestation.sigstore.json --yes

      - name: Verify the workflow identity and signature
        run: >-
          cosign verify-blob artifacts/audit_attestation.json
          --bundle artifacts/audit_attestation.sigstore.json
          --certificate-identity-regexp '^https://github\.com/saisravan909/lexcode-finos-gasc/.github/workflows/governance-pipeline.yml@refs/(heads|pull)/.*$'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Retain signed evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexcode-sigstore-evidence
          path: |
            artifacts/audit_attestation.json
            artifacts/audit_attestation.sigstore.json
            artifacts/pr_comment_preview.md
          if-no-files-found: error
          retention-days: 30
